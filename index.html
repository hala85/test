<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BONK! — Master Wrestling Rebuild</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            box-shadow: 0 0 30px rgba(255, 0, 128, 0.5);
            border: 4px solid #333;
            border-radius: 8px;
        }
        .comic-bubble {
            position: absolute;
            background: #fff;
            color: #000;
            padding: 8px 12px;
            border: 3px solid #000;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.8);
            pointer-events: none;
            transition: transform 0.1s ease;
            z-index: 1000;
        }
        .comic-bubble:after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 20px;
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #fff transparent;
            display: block;
            width: 0;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
